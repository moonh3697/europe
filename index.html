<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>유럽 27일 여행 플래너 & 이동표</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg:#eef2f4; --card:#fff; --sunk:#f5f8fa; --ink:#17222c; --mut:#5d6b77; 
  --line:#d5dde3; --acc:#1d5c82; --soft:#e6f1f8; --ok:#1f6a3f; --okbg:#dcefe3; 
  --err:#b3261e; --warn-bg:#fdf1dc; --warn-line:#e3b35c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.5; padding: 16px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
h1 { margin: 0; font-size: 22px; }
.sub { color: var(--mut); font-size: 13px; }
.tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px; margin-bottom: 14px; }
.tab { flex: 1; padding: 10px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; background: transparent; color: var(--mut); }
.tab.active { background: var(--acc); color: #fff; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.lock { max-width: 440px; margin: 40px auto; }
input, button, select, textarea { font: inherit; border-radius: 8px; padding: 8px 11px; border: 1px solid var(--line); }
input { background: var(--sunk); color: var(--ink); width: 100%; }
.btn { background: var(--acc); color: #fff; border: 0; font-weight: 700; cursor: pointer; white-space: nowrap; }
.ghost { background: var(--sunk); color: var(--ink); cursor: pointer; font-weight: 600; }
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.day { flex: 0 0 auto; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; cursor: pointer; text-align: left; min-width: 104px; }
.day.active { background: var(--soft); border-color: var(--acc); font-weight: 700; }
.grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; }
@media(max-width:860px){ .grid { grid-template-columns: 1fr; } }
.stop { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 9px; margin-bottom: 8px; align-items: start; }
.stop.sel { border-color: var(--acc); background: var(--soft); }
.num { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
#map { width: 100%; height: 350px; border-radius: 10px; border: 1px solid var(--line); z-index: 1; }
#gmap { width: 100%; height: 350px; border-radius: 10px; border: 0; }
.pin { background: #1d5c82; color: #fff; border: 2px solid #fff; border-radius: 50%; font-weight: 700; font-size: 11px; text-align: center; line-height: 20px; }
.pin.stay-pin { background: #1f6a3f; }
.guide-card { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px; background: var(--sunk); border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--line); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cats { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.cat-btn { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--line); cursor: pointer; color: var(--mut); }
.cat-btn.active { background: var(--soft); color: var(--acc); border-color: var(--acc); font-weight: 700; }
.leg { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--card); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: #fbeacb; color: #8a5200; }
.badge.done { background: var(--okbg); color: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>유럽 27일 여행 플래너 & 이동표</h1>
      <div class="sub">2026.12.12 – 2027.01.07 · 4인 동행 투어</div>
    </div>
    <div id="top-tools" hidden class="row">
      <span id="sync-txt" class="sub"></span>
      <button class="ghost" onclick="loadData()">새로고침</button>
      <button class="ghost" onclick="localStorage.removeItem('europe-trip-pw');location.reload()">잠금</button>
    </div>
  </header>

  <div class="card lock" id="lock-box">
    <h2 style="margin:0 0 8px">비밀번호 입력</h2>
    <p class="sub" style="margin:0 0 10px">힌트: 첫번째로 가는 도시의 이름을 영문 소문자로! (rome)</p>
    <form id="pw-form" class="row">
      <input type="password" id="pw-inp" placeholder="비밀번호" required style="flex:1">
      <button type="submit" class="btn" id="pw-btn">열기</button>
    </form>
    <p id="pw-msg" style="color:var(--err);margin:8px 0 0;font-size:13px"></p>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button class="tab active" id="t-itin" onclick="switchTab('itin')">🗺️ 27일 전체 일정표 & 동선 지도</button>
      <button class="tab" id="t-move" onclick="switchTab('move')">🚄 교통편 이동표 & 예매 관리</button>
    </div>

    <div id="v-itin">
      <div class="card">
        <form id="ai-form" class="row">
          <input id="ai-inp" placeholder="✨ AI 명령: 'Day 2에 지올리띠 젤라또 추가', '트레비 분수 삭제', 'Day 21과 Day 22 교체'" style="flex:1">
          <button class="btn" type="submit">실행</button>
        </form>
        <div id="ai-msg" class="sub" style="margin-top:6px;color:var(--ok)"></div>
      </div>

      <div class="days" id="day-list"></div>

      <div class="grid">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <div><strong id="cur-day-title" style="font-size:17px"></strong><div id="cur-day-sub" class="sub"></div></div>
            <button class="ghost" onclick="saveCloud()">💾 공유 저장</button>
          </div>
          <div id="stop-list"></div>
          <form id="add-form" style="border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px">
            <div class="row">
              <input id="add-name" placeholder="새 장소명 (예: 트라스테베레 맛집)" required style="flex:1">
              <input id="add-memo" placeholder="메모 (시간/팁)" style="flex:1">
              <button class="btn" type="submit">+ 추가</button>
            </div>
          </form>
        </div>

        <div>
          <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:8px">
              <strong>📍 동선 & 구글맵</strong>
              <div class="row">
                <button class="ghost" onclick="setMapMode('osm')">동선 지도</button>
                <button class="ghost" onclick="setMapMode('gmap')">구글맵 임베드</button>
                <a id="gmap-link" class="btn" style="text-decoration:none;font-size:12px;padding:6px 10px" target="_blank">구글맵 경로 ↗</a>
              </div>
            </div>
            <div id="map"></div>
            <iframe id="gmap" hidden loading="lazy"></iframe>
          </div>

          <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:6px">
              <strong>🧭 <span id="guide-city"></span> 추천 명소 가이드</strong>
            </div>
            <div class="cats" id="guide-cats">
              <button type="button" class="cat-btn active" data-cat="전체" onclick="setGuideCat('전체')">전체</button>
              <button type="button" class="cat-btn" data-cat="핵심명소" onclick="setGuideCat('핵심명소')">🏛️ 핵심</button>
              <button type="button" class="cat-btn" data-cat="야경·전망" onclick="setGuideCat('야경·전망')">🌃 야경</button>
              <button type="button" class="cat-btn" data-cat="미술관·박물관" onclick="setGuideCat('미술관·박물관')">🎨 미술관</button>
              <button type="button" class="cat-btn" data-cat="맛집·카페" onclick="setGuideCat('맛집·카페')">🍽️ 맛집</button>
              <button type="button" class="cat-btn" data-cat="근교·투어" onclick="setGuideCat('근교·투어')">🚆 근교</button>
            </div>
            <div id="guide-list" style="max-height:300px;overflow-y:auto"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="v-move" hidden>
      <div class="card"><strong>14개 주요 이동 구간 예매 현황</strong> <span id="move-sum" class="sub"></span></div>
      <div id="leg-list"></div>
    </div>
  </div>
</div>

      { name: "엘 린콘시요 타파스바", query: "El Rinconcillo, Seville", cat: "맛집·카페", desc: "1670년 오픈 세비야 최古 타파스바", lat: 37.3929, lng: -5.9874 }
    ],
    "론다·그라나다": [
      { name: "성 니콜라스 전망대", query: "Mirador de San Nicolás, Granada", cat: "야경·전망", desc: "알함브라 궁전 설산 야경 명소", lat: 37.1811, lng: -3.5927 }
    ],
    "그라나다·마드리드": [
      { name: "성 니콜라스 전망대", query: "Mirador de San Nicolás, Granada", cat: "야경·전망", desc: "알함브라 궁전 파노라마 뷰포인트", lat: 37.1811, lng: -3.5927 }
    ],
    "마드리드": [
      { name: "마드리드 왕궁", query: "Royal Palace of Madrid", cat: "핵심명소", desc: "서유럽 최대 규모 왕궁 투어", lat: 40.4180, lng: -3.7143 },
      { name: "데보드 신전 일몰", query: "Temple of Debod, Madrid", cat: "야경·전망", desc: "이집트 고대 신전과 마드리드 일몰", lat: 40.4240, lng: -3.7178 },
      { name: "산 히네스 츄러스", query: "Chocolatería San Ginés, Madrid", cat: "맛집·카페", desc: "1894년 오픈 24시 전통 츄러스", lat: 40.4168, lng: -3.7071 },
      { name: "톨레도 근교 투어", query: "Toledo, Spain", cat: "근교·투어", desc: "고속열차 33분 거리 옛 수도", lat: 39.8628, lng: -4.0273 }
    ]
  };

  const LEGS = [
    ["1", "12/12", "인천 → 로마", "대한항공 KE931 (14:05→19:35)", true],
    ["2", "12/15", "로마 → 피렌체", "고속열차 직통 (약 1시간 40분)", false],
    ["3", "12/16", "피렌체 → 베네치아", "고속열차 직통 (약 2시간 15분)", false],
    ["4", "12/18", "베네치아 → 루체른", "기차 밀라노 환승 (약 6시간 20분)", false],
    ["5", "12/20", "루체른 → 스트라스부르", "기차 바젤 환승 (약 3시간)", false],
    ["6", "12/21", "스트라스부르 → 파리", "OUIGO/TGV 직통 (약 1시간 45분)", false],
    ["7", "12/25", "파리 → 바르셀로나", "야간버스(12/24 밤) 또는 기차/항공", false],
    ["8", "12/28", "바르셀로나 → 포르투", "부엘링 VY1178 (13:00→13:55)", true],
    ["9", "12/30", "포르투 → 리스본", "CP 기차 또는 버스 (약 2시간 50분)", false],
    ["10", "1/1", "리스본 → 세비야", "플릭버스 07:20 직행 (약 6~7시간)", false],
    ["11", "1/3", "세비야 → 론다", "Damas 직행 버스 (약 2시간 15분)", false],
    ["14", "1/3", "론다 → 그라나다", "Renfe 기차 안테케라 환승 (약 3시간 15분)", false],
    ["12", "1/4", "그라나다 → 마드리드", "Renfe 고속열차 직통 (약 3시간 35분)", false],
    ["13", "1/7", "마드리드 → 인천", "대한항공 KE914 (21:25→18:15+1)", true]
  ];

  let pw = "", itin = INITIAL_ITINERARY, bookings = {}, curIdx = 0, selStop = 0, mapMode = "osm", guideCat = "전체", map, layer;

  async function api(body) {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
    return r.json();
  }

  async function unlock(p) {
    const msg = document.getElementById("pw-msg"), btn = document.getElementById("pw-btn");
    msg.textContent = "확인 중..."; btn.disabled = true;
    try {
      const r = await api({action:"get", pw:p});
      if(!r.ok) { msg.textContent = "비밀번호가 맞지 않습니다."; btn.disabled = false; return; }
      pw = p; localStorage.setItem("europe-trip-pw", p);
      bookings = r.bookings || {};
      if(bookings.itinerary_v1 && bookings.itinerary_v1.json) {
        try {
          const parsed = JSON.parse(bookings.itinerary_v1.json);
          if(parsed) Object.keys(parsed).forEach(k => {
            if(itin[k]) itin[k] = parsed[k].map(x => ({n: x.name||x.n, m: x.memo||x.m||"", q: x.q||x.name||x.n, lat: x.lat, lng: x.lng}));
          });
        } catch(e) {}
      }
      document.getElementById("lock-box").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("top-tools").hidden = false;
      document.getElementById("sync-txt").textContent = "동기화됨";
      renderAll();
    } catch(e) {
      msg.textContent = "연결 오류: 인터넷을 확인하세요.";
    }
    btn.disabled = false;
  }

  window.switchTab = function(t) {
    document.getElementById("v-itin").hidden = t !== "itin";
    document.getElementById("v-move").hidden = t !== "move";
    document.getElementById("t-itin").classList.toggle("active", t === "itin");
    document.getElementById("t-move").classList.toggle("active", t === "move");
    if(t === "itin") renderMap();
  };

  window.setMapMode = function(m) { mapMode = m; renderMap(); }
  window.setGuideCat = function(c) {
    guideCat = c;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === c));
    renderGuide();
  }

  window.curIdx = 0;
  window.selStop = 0;

  window.renderAll = function() {
    const dl = document.getElementById("day-list");
    dl.innerHTML = DAY_META.map((d, i) => `<button class="day${i === window.curIdx ? ' active' : ''}" onclick="window.curIdx=${i}; window.selStop=0; window.renderAll()"><b>${d[0].split(' ')[0]} ${d[0].split(' ')[1]}</b><br><span class="sub">${d[1]} (${(itin[d[0]]||[]).length})</span></button>`).join("");
    
    const d = DAY_META[window.curIdx], stops = itin[d[0]] || [];
    document.getElementById("cur-day-title").textContent = d[0];
    document.getElementById("cur-day-sub").textContent = d[1] + " · 총 " + stops.length + "개 지점";
    
    document.getElementById("stop-list").innerHTML = stops.length === 0 ? '<div class="sub" style="padding:10px">등록된 장소가 없습니다.</div>' : stops.map((s, i) => `<div class="stop${i === window.selStop ? ' sel' : ''}">
      <div class="num">${i + 1}</div>
      <div onclick="window.selStop=${i}; window.renderAll()" style="cursor:pointer"><b>${s.n}</b><div class="sub">${s.m || ""}</div></div>
      <div class="row">
        <button class="ghost" onclick="window.moveStop(${i}, -1)">↑</button>
        <button class="ghost" onclick="window.moveStop(${i}, 1)">↓</button>
        <button class="ghost" style="color:var(--err)" onclick="window.delStop(${i})">삭제</button>
      </div></div>`).join("");
    
    document.getElementById("guide-city").textContent = d[1];
    renderGuide();
    renderMap();
    renderLegs();
  };

  function renderGuide() {
    const d = DAY_META[window.curIdx];
    const items = (GUIDES[d[1]] || []).filter(it => guideCat === "전체" || it.cat === guideCat);
    document.getElementById("guide-list").innerHTML = items.length === 0 ? '<div class="sub" style="padding:8px">해당 카테고리 명소가 없습니다.</div>' : items.map((g, gi) => `<div class="guide-card">
      <div><b>${g.name}</b> <span style="font-size:10px;padding:1px 5px;border-radius:4px;background:var(--soft);color:var(--acc)">${g.cat}</span><div class="sub">${g.desc}</div></div>
      <button class="btn" onclick="window.addGuide('${g.name}', '${g.query}', '${g.desc}', ${g.lat}, ${g.lng})">+ 추가</button>
    </div>`).join("");
  }

  function renderMap() {
    const d = DAY_META[window.curIdx], stops = itin[d[0]] || [];
    const q = stops.map(s => encodeURIComponent(s.n + " " + d[1]));
    document.getElementById("gmap-link").href = q.length > 1 ? `https://www.google.com/maps/dir/?api=1&origin=${q[0]}&destination=${q[q.length - 1]}&waypoints=${q.slice(1, 9).join('|')}&travelmode=walking` : `https://www.google.com/maps/search/?api=1&query=${q[0] || encodeURIComponent(d[1])}`;
    
    const focus = stops[window.selStop] || stops[0];
    document.getElementById("gmap").src = `https://maps.google.com/maps?q=${encodeURIComponent((focus ? focus.n + " " : "") + d[1])}&z=14&output=embed`;
    document.getElementById("map").hidden = mapMode !== "osm";
    document.getElementById("gmap").hidden = mapMode !== "gmap";
    if (mapMode !== "osm" || typeof L === "undefined") return;
    
    if (!map) {
      map = L.map("map").setView(d[2], 13);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png").addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    setTimeout(() => map.invalidateSize(), 50);
    layer.clearLayers();
    
    const pts = [];
    stops.forEach((s, i) => {
      if (s.lat && s.lng) {
        pts.push([s.lat, s.lng]);
        const isStay = /호텔|호스텔|아파트|레지던스|숙소|피플|톡 호스텔|바라바스|센트럴 하우스|아테나스|기네브라|윈드로제|플러스|아론|스팟 패밀리|Room00|BYPILLOW/.test(s.n);
        L.marker([s.lat, s.lng], {icon: L.divIcon({className:"pin" + (isStay ? " stay-pin" : ""), html:String(i+1), iconSize:[24,24], iconAnchor:[12,12]})})
         .bindPopup(`<b>${i+1}. ${s.n}</b><br>${s.m}`).addTo(layer);
      }
    });
    if (pts.length > 1) L.polyline(pts, {color:"#1d5c82", weight:3}).addTo(layer);
    if (focus && focus.lat) map.setView([focus.lat, focus.lng], 14); else map.setView(d[2], 13);
  }

  window.moveStop = function(i, dir) {
    const a = itin[DAY_META[window.curIdx][0]];
    if (a[i + dir]) {
      [a[i], a[i + dir]] = [a[i + dir], a[i]];
      window.selStop = i + dir;
      window.renderAll();
      saveCloud();
    }
  };

  window.delStop = function(i) {
    itin[DAY_META[window.curIdx][0]].splice(i, 1);
    window.selStop = 0;
    window.renderAll();
    saveCloud();
  };

  window.addGuide = function(name, query, desc, lat, lng) {
    if(!itin[DAY_META[window.curIdx][0]]) itin[DAY_META[window.curIdx][0]] = [];
    itin[DAY_META[window.curIdx][0]].push({n: name, m: "[추천] " + desc, q: query, lat, lng});
    window.selStop = itin[DAY_META[window.curIdx][0]].length - 1;
    window.renderAll();
    saveCloud();
  };

  document.getElementById("add-form").onsubmit = e => {
    e.preventDefault();
    const d = DAY_META[window.curIdx], n = document.getElementById("add-name").value.trim(), m = document.getElementById("add-memo").value.trim();
    if (!n) return;
    if(!itin[d[0]]) itin[d[0]] = [];
    itin[d[0]].push({n, m, q: n + " " + d[1], lat: d[2][0], lng: d[2][1]});
    document.getElementById("add-name").value = ""; document.getElementById("add-memo").value = "";
    window.selStop = itin[d[0]].length - 1;
    window.renderAll();
    saveCloud();
  };

  document.getElementById("ai-form").onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById("ai-inp"), cmd = inp.value.trim(), msg = document.getElementById("ai-msg");
    inp.value = "";
    const sw = cmd.match(/Day\s*(\d+).*Day\s*(\d+).*(교체|바꿔)/i);
    if (sw) {
      const d1 = DAY_META.find(x => x[0].startsWith("Day " + sw[1] + " ")), d2 = DAY_META.find(x => x[0].startsWith("Day " + sw[2] + " "));
      if (d1 && d2) {
        [itin[d1[0]], itin[d2[0]]] = [itin[d2[0]], itin[d1[0]]];
        window.renderAll(); saveCloud(); msg.textContent = "✅ 일정을 교체했습니다."; return;
      }
    }
    const dl = cmd.match(/^(?:Day\s*(\d+)(?:에서|에)?\s*)?(.+?)\s*(?:삭제|빼줘|지워)/i);
    if (dl) {
      const d = dl[1] ? DAY_META.find(x => x[0].startsWith("Day " + dl[1] + " ")) : DAY_META[window.curIdx];
      const idx = itin[d[0]].findIndex(x => x.n.includes(dl[2].trim()));
      if (idx >= 0) {
        itin[d[0]].splice(idx, 1); window.renderAll(); saveCloud(); msg.textContent = "✅ 삭제했습니다."; return;
      }
    }
    const ad = cmd.match(/^(?:Day\s*(\d+)(?:에|에서)?\s*)?(.+?)\s*(?:추가|넣어)/i);
    if (ad) {
      const d = ad[1] ? DAY_META.find(x => x[0].startsWith("Day " + ad[1] + " ")) : DAY_META[window.curIdx];
      if(!itin[d[0]]) itin[d[0]] = [];
      itin[d[0]].push({n: ad[2].trim(), m: "비서 추가", q: ad[2].trim() + " " + d[1], lat: d[2][0], lng: d[2][1]});
      window.renderAll(); saveCloud(); msg.textContent = "✅ 추가했습니다."; return;
    }
    msg.textContent = "💡 예: 'Day 2에 지올리띠 추가', '트레비 분수 삭제', 'Day 21과 Day 22 교체'";
  };

  function renderLegs() {
    let done = 0;
    document.getElementById("leg-list").innerHTML = LEGS.map(l => {
      const b = bookings[l[0]] || {}, ok = l[4] || !!b.code;
      if (ok) done++;
      return `<div class="leg">
        <div class="row" style="justify-content:space-between">
          <div><b>${l[1]} · ${l[2]}</b><div class="sub">${l[3]} ${b.code ? '· 예약번호: ' + b.code : ''}</div></div>
          <span class="badge${ok ? ' done' : ''}">${ok ? '예매 완료' : '아직'}</span>
        </div>
        <div class="row" style="margin-top:8px">
          <input id="bt-${l[0]}" value="${b.time || ''}" placeholder="출발시간" style="width:110px">
          <input id="bc-${l[0]}" value="${b.code || ''}" placeholder="예약번호" style="flex:1">
          <button class="btn" onclick="window.saveLeg('${l[0]}')">저장</button>
        </div>
      </div>`;
    }).join("");
    document.getElementById("move-sum").textContent = "(완료 " + done + " / 전체 " + LEGS.length + ")";
  }

  async function saveCloud() {
    const payload = {};
    Object.keys(itin).forEach(k => payload[k] = itin[k].map(x => ({name: x.n, memo: x.m, q: x.q, lat: x.lat, lng: x.lng})));
    await api({action:"save", pw, legId:"itinerary_v1", data:{json:JSON.stringify(payload)}});
    document.getElementById("sync-txt").textContent = "저장됨";
  }

  window.saveLeg = async function(id) {
    const r = await api({action:"save", pw, legId:id, data:{time:document.getElementById("bt-"+id).value, code:document.getElementById("bc-"+id).value}});
    if(r.ok) { bookings = r.bookings; renderLegs(); }
  };

  window.loadData = async function() { if(pw) await unlock(pw); }

  document.getElementById("pw-form").onsubmit = e => { e.preventDefault(); unlock(document.getElementById("pw-inp").value); };
  const savedPw = localStorage.getItem("europe-trip-pw");
  if(savedPw) unlock(savedPw);
})();
</script>
</body>
</html>
