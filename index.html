<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>유럽 27일 여행 플래너 & 이동표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #eef2f4;
    --card: #ffffff;
    --sunk: #f5f8fa;
    --ink: #17222c;
    --muted: #5d6b77;
    --line: #d5dde3;
    --accent: #1d5c82;
    --accent-soft: #e3eff7;
    --accent-ink: #ffffff;
    --done-bg: #dcefe3;
    --done-ink: #1f6a3f;
    --todo-bg: #fbeacb;
    --todo-ink: #8a5200;
    --warn-bg: #fdf1dc;
    --warn-line: #e3b35c;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground: #10171d;
      --card: #1a232b;
      --sunk: #141c23;
      --ink: #e6edf2;
      --muted: #97a6b2;
      --line: #2c3842;
      --accent: #7fb8dd;
      --accent-soft: #1d3242;
      --accent-ink: #0d1a24;
      --done-bg: #1d3a2a;
      --done-ink: #8fd8ab;
      --todo-bg: #3d2f16;
      --todo-ink: #f1c27a;
      --warn-bg: #33291a;
      --warn-line: #8a6a2e;
      --err: #f2998f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  }

  .wrap { max-width: 1120px; margin: 0 auto; }
  .narrow-wrap { max-width: 600px; margin: 0 auto; }

  header { display: grid; gap: 6px; margin-bottom: 18px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.08em; color: var(--accent);
  }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; text-wrap: balance; }
  .summary { margin: 0; color: var(--muted); font-size: 14px; }
  .summary b { color: var(--ink); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .linkbtn {
    background: none; border: 0; padding: 0; font: inherit; color: var(--accent);
    text-decoration: underline; cursor: pointer;
  }

  /* 상단 메인 탭 내비게이션 */
  .main-nav {
    display: flex; gap: 8px; margin-bottom: 18px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px;
  }
  .nav-tab {
    flex: 1; font: inherit; font-weight: 700; font-size: 15px;
    border: 0; border-radius: 8px; padding: 10px 14px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: all 0.15s ease;
  }
  .nav-tab.active {
    background: var(--accent); color: var(--accent-ink);
  }
  .nav-tab:not(.active):hover {
    background: var(--sunk); color: var(--ink);
  }

  /* 비밀번호 화면 */
  .lock {
    max-width: 560px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 16px; display: grid; gap: 12px;
  }
  .lock h2 { margin: 0; font-size: 18px; }
  .lock p { margin: 0; color: var(--muted); font-size: 14px; }
  .lock form { display: flex; gap: 8px; flex-wrap: wrap; }
  .lock input { flex: 1 1 180px; }
  .pwchange { margin-bottom: 20px; }
  .pwchange form { display: grid; grid-template-columns: 1fr 1fr; }
  .pwchange form .primary, .pwchange form .ghost { justify-self: start; }
  @media (max-width: 420px) { .pwchange form { grid-template-columns: 1fr; } }
  .msg { font-size: 14px; }
  .lock .pw-hint { color: var(--ink); font-size: 14px; background: var(--sunk); border-radius: 8px; padding: 8px 12px; }
  .lock .pw-hint:empty { display: none; }
  .msg.ok { color: var(--done-ink); }
  .msg.err { color: var(--err); }

  input[type="text"], input[type="password"], textarea, select {
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; width: 100%; min-width: 0;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary {
    font: inherit; font-weight: 700; font-size: 14px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .ghost {
    font: inherit; font-size: 14px; font-weight: 500;
    background: var(--sunk); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }

  /* ==================== [탭 1] 27일 전체 일정표 & 지도 ==================== */
  .planner-layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 840px) {
    .planner-layout { grid-template-columns: 1fr; }
  }

  .day-sidebar {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; display: grid; gap: 8px;
    max-height: calc(100vh - 140px); overflow-y: auto;
    position: sticky; top: 16px;
  }
  @media (max-width: 840px) {
    .day-sidebar {
      position: static; max-height: none;
      display: flex; overflow-x: auto; gap: 8px; padding: 10px;
    }
  }
  .country-filter {
    display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  @media (max-width: 840px) { .country-filter { display: none; } }
  .c-pill {
    font: inherit; font-size: 12px; font-weight: 600;
    border: 1px solid var(--line); background: var(--sunk); color: var(--muted);
    border-radius: 999px; padding: 3px 9px; cursor: pointer;
  }
  .c-pill.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .day-btn {
    text-align: left; font: inherit; border: 1px solid transparent;
    background: transparent; color: var(--ink); border-radius: 10px;
    padding: 9px 11px; cursor: pointer; display: grid; gap: 2px;
    flex-shrink: 0;
  }
  .day-btn:hover { background: var(--sunk); }
  .day-btn.active {
    background: var(--accent-soft); border-color: var(--accent);
  }
  .day-btn-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
  .day-btn-city { font-size: 14px; font-weight: 600; color: var(--ink); }
  .day-btn-cnt { font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }

  .day-main { display: grid; gap: 14px; }
  .day-header-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: grid; gap: 10px;
  }
  .day-title-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .day-title-row h2 { margin: 0; font-size: 21px; }
  .day-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .map-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; display: grid;
  }
  .map-frame { width: 100%; height: 320px; border: 0; display: block; background: var(--sunk); }
  .map-bar {
    padding: 10px 14px; background: var(--sunk); border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }
  .gmaps-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink);
    text-decoration: none; font-weight: 700; font-size: 13px;
    padding: 7px 12px; border-radius: 8px;
  }

  .spot-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .spot-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: grid; grid-template-columns: 32px 1fr auto;
    gap: 10px; align-items: start;
  }
  .spot-card.visited { opacity: 0.65; background: var(--sunk); }
  .spot-num {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 13px;
    display: grid; place-items: center; margin-top: 2px;
  }
  .spot-body { display: grid; gap: 4px; min-width: 0; }
  .spot-name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .spot-name { font-weight: 700; font-size: 16px; }
  .spot-card.visited .spot-name { text-decoration: line-through; }
  .spot-query { font-size: 12px; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
  .spot-memo { font-size: 14px; color: var(--ink); background: var(--sunk); padding: 6px 10px; border-radius: 8px; margin-top: 2px; }
  .spot-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    font: inherit; font-size
