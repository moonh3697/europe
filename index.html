<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>2026-2027 유럽 4인 여행 플래너 & 이동표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  :root {
    color-scheme: light;
    --ground: #eef2f4;
    --card: #ffffff;
    --sunk: #f5f8fa;
    --ink: #17222c;
    --muted: #5d6b77;
    --line: #d5dde3;
    --accent: #1d5c82;
    --accent-soft: #e6f1f8;
    --accent-ink: #ffffff;
    --done-bg: #dcefe3;
    --done-ink: #1f6a3f;
    --todo-bg: #fbeacb;
    --todo-ink: #8a5200;
    --warn-bg: #fdf1dc;
    --warn-line: #e3b35c;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground: #10171d;
      --card: #1a232b;
      --sunk: #141c23;
      --ink: #e6edf2;
      --muted: #97a6b2;
      --line: #2c3842;
      --accent: #7fb8dd;
      --accent-soft: #1a2e3d;
      --accent-ink: #0d1a24;
      --done-bg: #1d3a2a;
      --done-ink: #8fd8ab;
      --todo-bg: #3d2f16;
      --todo-ink: #f1c27a;
      --warn-bg: #33291a;
      --warn-line: #8a6a2e;
      --err: #f2998f;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .narrow { max-width: 640px; margin: 0 auto; }

  header { display: grid; gap: 8px; margin-bottom: 18px; }
  .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 16px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.06em; color: var(--accent); font-weight: 600;
  }
  h1 { margin: 2px 0 0; font-size: 25px; line-height: 1.25; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .linkbtn {
    background: none; border: 0; padding: 0; font: inherit; color: var(--accent);
    text-decoration: underline; cursor: pointer;
  }

  .nav-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px; margin-top: 4px;
  }
  .nav-tab {
    flex: 1 1 200px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 15px; font-weight: 700;
    padding: 11px 16px; border-radius: 10px; border: 0; cursor: pointer;
    background: transparent; color: var(--muted); transition: 0.15s;
  }
  .nav-tab.active { background: var(--accent); color: var(--accent-ink); }
  .nav-tab .badge {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    padding: 2px 8px; border-radius: 999px;
    background: rgba(127,127,127,0.16); color: inherit;
  }
  .nav-tab.active .badge { background: rgba(255,255,255,0.22); }

  .lock {
    max-width: 540px; margin: 24px auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 18px; display: grid; gap: 12px;
  }
  .lock h2 { margin: 0; font-size: 19px; }
  .lock p { margin: 0; color: var(--muted); font-size: 14px; }
  .lock form { display: flex; gap: 8px; flex-wrap: wrap; }
  .lock input { flex: 1 1 180px; }
  .pwchange { margin: 0 auto 18px; }
  .pwchange form { display: grid; grid-template-columns: 1fr 1fr; }
  .msg { font-size: 14px; margin: 0; }
  .lock .pw-hint { color: var(--ink); font-size: 14px; background: var(--sunk); border-radius: 8px; padding: 8px 12px; }
  .lock .pw-hint:empty { display: none; }
  .msg.ok { color: var(--done-ink); }
  .msg.err { color: var(--err); }

  input[type="text"], input[type="password"], select, textarea {
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--sunk); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; width: 100%; min-width: 0;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary {
    font: inherit; font-weight: 700; font-size: 14px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 9px; padding: 9px 16px; cursor: pointer;
  }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .ghost {
    font: inherit; font-size: 13px; font-weight: 600;
    background: var(--sunk); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--accent); }

  /* AI 명령어 편집 바 */
  .ai-bar {
    background: var(--card); border: 1.5px solid var(--accent); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; display: grid; gap: 8px;
  }
  .ai-bar-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
  .ai-bar-title { font-size: 14px; font-weight: 700; color: var(--accent); }
  .ai-examples { display: flex; flex-wrap: wrap; gap: 5px; }
  .ai-ex {
    font: inherit; font-size: 12px; background: var(--sunk); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer;
  }
  .ai-ex:hover { border-color: var(--accent); color: var(--ink); }
  .ai-form { display: flex; gap: 8px; }
  .ai-log { font-size: 13px; color: var(--done-ink); margin: 0; }
  .ai-log.err { color: var(--err); }

  /* 메인 뷰: 27일 일정 & 지도 */
  .planner-bar {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px; display: grid; gap: 10px;
  }
  .city-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .city-chip {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--sunk); color: var(--ink); cursor: pointer;
  }
  .city-chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .day-strip {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .day-pill {
    flex: 0 0 auto; text-align: left;
    background: var(--sunk); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 11px; cursor: pointer; color: var(--ink); min-width: 108px;
  }
  .day-pill.active {
    background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .day-pill .d-top { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 700; color: var(--accent); display: block; }
  .day-pill .d-city { font-size: 13px; font-weight: 700; display: block; }
  .day-pill .d-cnt { font-size: 11px; color: var(--muted); }

  .planner-grid {
    display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 16px; align-items: start;
  }
  @media (max-width: 900px) { .planner-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: grid; gap: 14px;
  }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .panel-head h2 { margin: 0; font-size: 19px; }
  .panel-sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

  .stop-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .stop-card {
    background: var(--sunk); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 12px; display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start;
  }
  .stop-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .stop-num {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .stop-body { min-width: 0; display: grid; gap: 3px; }
  .stop-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .stop-name { font-weight: 700; font-size: 15px; cursor: pointer; }
  .stop-name:hover { color: var(--accent); text-decoration: underline; }
  .stop-tag {
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .stop-tag.stay { background: var(--done-bg); color: var(--done-ink); border-color: transparent; }
  .stop-tag.move { background: var(--todo-bg); color: var(--todo-ink); border-color: transparent; }
  .stop-memo { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .stop-query { font-size: 12px; color: var(--accent); }
  .stop-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .mini-btns { display: flex; gap: 4px; }
  .icon-btn {
    background: var(--card); border: 1px solid var
