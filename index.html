<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>유럽 27일 플래너 & 이동표</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#eef2f4;--card:#fff;--sunk:#f5f8fa;--ink:#17222c;--mut:#5d6b77;--line:#d5dde3;--acc:#1d5c82;--soft:#e6f1f8;--ok:#1f6a3f;--okbg:#dcefe3;--err:#b3261e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;padding:16px}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:transparent;color:var(--mut)}
.tab.active{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.lock{max-width:440px;margin:40px auto}
input,button{font:inherit;border-radius:8px;padding:8px 11px;border:1px solid var(--line)}
input{background:var(--sunk);color:var(--ink);width:100%}
.btn{background:var(--acc);color:#fff;border:0;font-weight:700;cursor:pointer;white-space:nowrap}
.ghost{background:var(--sunk);color:var(--ink);cursor:pointer;font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:0 0 auto;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;text-align:left}
.day.active{background:var(--soft);border-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;align-items:start}
.stop.sel{border-color:var(--acc);background:var(--soft)}
.num{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
#map{width:100%;height:340px;border-radius:10px;border:1px solid var(--line);z-index:1}
#gmap{width:100%;height:340px;border-radius:10px;border:0}
.pin{background:#1d5c82;color:#fff;border:2px solid #fff;border-radius:50%;font-weight:700;font-size:11px;text-align:center;line-height:20px}
.leg{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#fbeacb;color:#8a5200}
.badge.done{background:var(--okbg);color:var(--ok)}
.guide-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:var(--sunk);border-radius:8px;margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>유럽 27일 여행 플래너 & 이동표</h1><div class="sub">2026.12.12 – 2027.01.07 · 로마→피렌체→베네치아→루체른→스트라스부르→파리→바르셀로나→포르투→리스본→세비야→론다→그라나다→마드리드</div></div>
    <div id="top-tools" hidden class="row">
      <span id="sync-txt" class="sub"></span>
      <button class="ghost" onclick="loadData()">새로고침</button>
      <button class="ghost" onclick="localStorage.removeItem('europe-trip-pw');location.reload()">잠금</button>
    </div>
  </header>

  <div class="card lock" id="lock-box">
    <h2 style="margin:0 0 8px">비밀번호 입력</h2>
    <p class="sub" style="margin:0 0 10px">힌트: 첫번째로 가는 도시의 이름을 영문 소문자로!</p>
    <form id="pw-form" class="row">
      <input type="password" id="pw-inp" placeholder="비밀번호" required style="flex:1">
      <button type="submit" class="btn" id="pw-btn">열기</button>
    </form>
    <p id="pw-msg" style="color:var(--err);margin:8px 0 0;font-size:13px"></p>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button class="tab active" id="t-itin" onclick="switchTab('itin')">🗺️ 27일 전체 일정표 & 동선 지도</button>
      <button class="tab" id="t-move" onclick="switchTab('move')">🚄 교통편 이동표 & 예매 관리</button>
    </div>

    <div id="v-itin">
      <div class="card">
        <form id="ai-form" class="row">
          <input id="ai-inp" placeholder="✨ AI 명령: 'Day 2에 지올리띠 젤라또 추가', '트레비 분수 삭제', 'Day 21과 Day 22 교체'" style="flex:1">
          <button class="btn" type="submit">실행</button>
        </form>
        <div id="ai-msg" class="sub" style="margin-top:6px;color:var(--ok)"></div>
      </div>

      <div class="days" id="day-list"></div>

      <div class="grid">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <div><strong id="cur-day-title" style="font-size:17px"></strong><div id="cur-day-sub" class="sub"></div></div>
            <button class="ghost" onclick="saveCloud()">💾 공유 저장</button>
          </div>
          <div id="stop-list"></div>
          <form id="add-form" style="border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px">
            <div class="row">
              <input id="add-name" placeholder="새 장소명 (예: 트라스테베레 맛집)" required style="flex:1">
              <input id="add-memo" placeholder="메모 (시간/팁)" style="flex:1">
              <button class="btn" type="submit">+ 추가</button>
            </div>
          </form>
        </div>

        <div>
          <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:8px">
              <strong>📍 동선 & 구글맵</strong>
              <div class="row">
                <button class="ghost" onclick="setMapMode('osm')">동선 지도</button>
                <button class="ghost" onclick="setMapMode('gmap')">구글맵 임베드</button>
                <a id="gmap-link" class="btn" style="text-decoration:none;font-size:12px;padding:6px 10px" target="_blank">구글맵 경로 ↗</a>
              </div>
            </div>
            <div id="map"></div>
            <iframe id="gmap" hidden loading="lazy"></iframe>
          </div>

          <div class="card">
            <strong style="display:block;margin-bottom:8px">🧭 <span id="guide-city"></span> 추천 명소 바로 추가</strong>
            <div id="guide-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="v-move" hidden>
      <div class="card"><strong>14개 주요 이동 구간 예매 현황</strong> <span id="move-sum" class="sub"></span></div>
      <div id="leg-list"></div>
    </div>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxnsNrXANrjEXfquUcYSaaXUqXzTFMljh2PvJv21WaBoVtUhvYBTI4uYTNJYX2xyE0j/exec";
